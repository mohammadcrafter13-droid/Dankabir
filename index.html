<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071b12">
<title> مار سبز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;inset:0}
body{
  font-family:Vazirmatn,Tahoma,Arial,sans-serif;
  background:#071b12;
  color:#ecfff4;
  touch-action:none;
  user-select:none;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,select{font:inherit}
button{cursor:pointer}
.app{
  width:100%;
  height:100dvh;
  min-height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% -10%,rgba(35,150,83,.24),transparent 38%),
    linear-gradient(145deg,#06150e,#0a2417 55%,#06150e);
}
.page{display:none;width:100%;height:100%;overflow:hidden}
.page.active{display:flex}

.home,.settings{
  align-items:center;
  justify-content:center;
  padding:18px;
}
.card{
  width:min(94vw,500px);
  background:rgba(10,38,24,.9);
  border:1px solid rgba(106,221,139,.2);
  border-radius:26px;
  padding:30px 22px;
  box-shadow:0 18px 55px rgba(0,0,0,.38);
}
.logo{font-size:58px;text-align:center;margin-bottom:8px}
h1{margin:0;text-align:center;font-size:31px}
.subtitle{text-align:center;color:#9fc9ad;margin:10px 0 28px}
.main-btn,.secondary-btn{
  width:100%;
  border:0;
  border-radius:17px;
  padding:15px 18px;
  margin-top:12px;
  color:white;
  font-weight:800;
}
.main-btn{background:linear-gradient(135deg,#20a65b,#08763c);box-shadow:0 9px 22px rgba(17,151,78,.24)}
.secondary-btn{background:#123c26;border:1px solid #235c3a}
.main-btn:active,.secondary-btn:active,.pause-btn:active{transform:scale(.98)}

.settings .card{max-height:94dvh;overflow:auto}
.settings-title{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.settings-title h2{margin:0;font-size:25px}
.back-btn{
  border:0;background:#123c26;color:#dffff0;border-radius:13px;
  padding:9px 12px;font-size:18px;display:grid;place-items:center
}
.setting{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(150,230,175,.1);
  border-radius:16px;
  padding:13px;
  margin:10px 0;
}
.setting label{display:block;color:#c8ecd5;font-weight:700;margin-bottom:8px}
.setting select{
  width:100%;background:#071b12;color:#eafff0;
  border:1px solid #2b6142;border-radius:12px;padding:11px;
  outline:none
}
/* ===== Custom dropdown (replaces the native <select> UI) ===== */
.cs{position:relative}
select.cs-native{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;pointer-events:none
}
.cs-trigger{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:#071b12;color:#eafff0;border:1px solid #2b6142;border-radius:12px;
  padding:12px 13px;text-align:right;
}
.cs-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-chevron{flex:none;color:#7fd79f;transition:transform .22s ease}
.cs.open .cs-trigger{border-color:#35d879;box-shadow:0 0 0 3px rgba(53,216,121,.12)}
.cs.open .cs-chevron{transform:rotate(180deg)}
.cs-menu{
  overflow:hidden;max-height:0;
  transition:max-height .25s ease,margin-top .25s ease;
  background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:13px;
  margin-top:0;
}
.cs.open .cs-menu{max-height:340px;margin-top:8px;border-color:rgba(150,230,175,.14);overflow-y:auto}
.cs-option{
  display:block;width:100%;text-align:right;background:transparent;border:0;
  color:#c8ecd5;padding:12px 13px;font-weight:700;font-size:14.5px;border-radius:10px
}
.cs-option.active{background:rgba(53,216,121,.16);color:#7ff0a6}
.cs-option:active{background:rgba(53,216,121,.26)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{
  width:52px;height:29px;border-radius:30px;background:#284735;
  position:relative;border:0;flex:none
}
.switch::after{
  content:"";position:absolute;width:23px;height:23px;top:3px;right:4px;
  border-radius:50%;background:#b5c7bb;transition:.2s
}
.switch.on{background:#159653}
.switch.on::after{right:25px;background:#fff}

.game{
  flex-direction:column;
  align-items:center;
  padding:10px 10px max(10px,env(safe-area-inset-bottom));
}
.game-top{
  width:min(96vw,760px);
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:8px
}
.game-title{font-weight:900;font-size:22px}
.stats{display:flex;gap:7px}
.stat{
  background:#0d3320;border:1px solid #1c5735;border-radius:12px;
  padding:7px 10px;font-size:12px;color:#bce4ca
}
.stat b{color:#fff;font-size:14px;display:inline-block}
@keyframes scoreBump{0%{transform:scale(1)}35%{transform:scale(1.4);color:#7ff0a6}100%{transform:scale(1)}}
.stat b.bump{animation:scoreBump .3s ease}
.pause-btn{
  border:0;background:#d28b19;color:#fff;font-weight:900;
  border-radius:13px;padding:10px 14px;min-width:100px
}
.pause-btn.resume{background:#168b4b}
.pause-btn:disabled{opacity:.45;cursor:not-allowed}

.board-wrap{
  width:min(96vw,760px);
  flex:1;
  min-height:0;
  display:flex;align-items:center;justify-content:center;
}
#gameCanvas{
  display:block;
  width:min(96vw,760px);
  height:auto;
  max-height:calc(100dvh - 104px);
  aspect-ratio:1;
  background:#06160d;
  border:2px solid #1b5a36;
  border-radius:18px;
  box-shadow:0 12px 38px rgba(0,0,0,.42);
  touch-action:none;
}

.overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(2,13,8,.72);backdrop-filter:blur(5px);
  z-index:20
}
.overlay.hidden{display:none}
.hidden{display:none!important}
.overlay-card{
  width:min(90vw,390px);background:#0b2a1a;
  border:1px solid #2a6843;border-radius:24px;padding:26px 20px;text-align:center;
  box-shadow:0 20px 55px rgba(0,0,0,.45)
}
.overlay-icon{font-size:48px}
.overlay h2{margin:9px 0;font-size:26px}
.overlay p{color:#a8ceb5;margin:8px 0 18px}
.overlay .main-btn{margin-top:0}
.overlay-extra{margin-top:10px}
.overlay-extra.hidden{display:none}


/* ===== Modern full-screen interface ===== */
.page{touch-action:none}
.home{padding:0;align-items:stretch;justify-content:stretch}
.home-shell{
  width:100%;height:100%;display:flex;flex-direction:column;
  padding:22px max(20px,env(safe-area-inset-right)) 16px max(20px,env(safe-area-inset-left))
}
.home-header{
  width:min(1120px,100%);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:42px;height:42px;border-radius:13px;background:#20a65b;
  display:grid;place-items:center;font-size:22px;font-weight:900;
  box-shadow:0 8px 25px rgba(32,166,91,.25)
}
.brand-name{font-size:17px;font-weight:900;letter-spacing:2px}
.brand-sub{font-size:9px;color:#648d72;letter-spacing:1.5px;margin-top:3px}
.icon-btn{
  width:43px;height:43px;border:1px solid #244b35;background:#0c2b1b;
  color:#dff8e8;border-radius:13px;font-size:21px
}
.home-main{
  flex:1;min-height:0;width:min(1120px,100%);margin:0 auto;
  display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center
}
.hero{padding:20px 0}
.hero-kicker{font-size:11px;letter-spacing:3px;color:#4bd37e;font-weight:900;margin-bottom:12px}
.hero h1{
  font-size:clamp(50px,8vw,86px);text-align:right;line-height:1;
  margin:0 0 16px;letter-spacing:-2px
}
.hero p{color:#94bca2;font-size:16px;max-width:480px;line-height:1.9;margin:0 0 25px}
.hero .main-btn{width:auto;min-width:205px;margin:0;padding:15px 32px}
.score-panel{
  background:rgba(10,35,22,.78);border:1px solid rgba(112,222,145,.16);
  border-radius:24px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.28)
}
.panel-head{display:flex;align-items:center;justify-content:space-between}
.panel-label{display:block;color:#80a98d;font-size:12px;margin-bottom:5px}
.panel-head strong{font-size:44px;line-height:1}
.record-badge{
  font-size:10px;font-weight:900;letter-spacing:1.5px;color:#7df2a3;
  border:1px solid #276b43;border-radius:9px;padding:6px 8px
}
.chart-wrap{
  height:155px;margin-top:18px;border-radius:15px;
  background:rgba(3,16,10,.45);overflow:hidden
}
#scoreChart{display:block;width:100%;height:100%}
.chart-foot{
  display:flex;justify-content:space-between;color:#668f75;
  font-size:11px;margin-top:9px
}
.home-footer{
  width:min(1120px,100%);margin:0 auto;color:#507762;font-size:9px;
  display:flex;justify-content:center;gap:9px
}
.dot{width:3px;height:3px;border-radius:50%;background:#38704c;margin-top:4px}

.game{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
.game-actions{display:flex;gap:7px;align-items:center}
.exit-btn,.pause-btn{
  border:0;color:#fff;font-weight:900;border-radius:12px;padding:10px 13px;
  display:inline-flex;align-items:center;gap:6px;justify-content:center
}
.exit-btn{background:#40201f;border:1px solid #69322e}
.pause-btn{background:#b87815}
.pause-btn.resume{background:#168b4b}
.board-wrap{width:min(98vw,860px)}
#gameCanvas{
  width:min(98vw,860px);
  max-height:calc(100dvh - 92px);
  border-radius:22px
}
.overlay-icon{font-size:12px;letter-spacing:3px;color:#65e994;font-weight:900}
.overlay-extra .secondary-btn{background:#123c26;border:1px solid #235c3a}
.overlay-extra #overlayExitBtn{background:#40201f;border:1px solid #69322e}

@media(max-width:760px){
  .home-shell{padding:15px 15px 11px}
  .home-main{grid-template-columns:1fr;gap:12px;align-content:center}
  .hero{text-align:center;padding:8px 0}
  .hero h1{text-align:center;font-size:55px}
  .hero p{font-size:13px;margin:0 auto 16px}
  .hero .main-btn{min-width:210px}
  .score-panel{padding:16px}
  .chart-wrap{height:115px}
  .panel-head strong{font-size:34px}
  .home-footer{font-size:8px}
}

@media(max-height:650px){
  .logo{font-size:42px}
  .card{padding:20px}
  h1{font-size:26px}
  .subtitle{margin-bottom:16px}
  .setting{padding:9px;margin:7px 0}
  .game{padding-top:5px}
  .game-title{font-size:18px}
  .stat{padding:5px 8px}
  .pause-btn{padding:8px 11px}
}

/* ===== Modern Play-Store inspired refresh ===== */
:root{--bg:#07110d;--surface:#0d1d16;--line:rgba(145,230,173,.13);--text:#effff5;--muted:#86a996;--green:#35d879;--green2:#149653;--danger:#ef665d}
body{font-family:Vazirmatn,Inter,Tahoma,Arial,sans-serif;background:var(--bg)}
.app{background:radial-gradient(900px 500px at 50% -120px,rgba(53,216,121,.16),transparent 65%),radial-gradient(700px 500px at 100% 100%,rgba(20,150,83,.09),transparent 65%),#07110d;position:relative;overflow:hidden}
.app::before{
  content:"";position:absolute;inset:-20%;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px 400px at 20% 15%,rgba(61,232,144,.10),transparent 60%),
    radial-gradient(500px 380px at 85% 80%,rgba(80,200,255,.07),transparent 60%);
  animation:auroraShift 16s ease-in-out infinite alternate;
}
.app>.page{position:relative;z-index:1}
@keyframes auroraShift{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(3%,-2%) scale(1.06)}
}
@media(prefers-reduced-motion:reduce){.app::before{animation:none}}
.home-shell{padding:20px max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left))}
.home-header{height:54px}
.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#43e58a,#148f50);box-shadow:0 10px 30px rgba(45,210,117,.22)}
.brand-name{font-size:18px;letter-spacing:2.5px}.brand-sub{color:#5f8c70}
.icon-btn{width:46px;height:46px;border-radius:14px;background:rgba(17,42,29,.82);border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.18);display:grid;place-items:center}
.icon-btn:active svg{transform:rotate(35deg)}
.icon-btn svg{transition:transform .25s ease}
.home-main{grid-template-columns:1.05fr .95fr;gap:44px}
.hero-kicker{color:var(--green);letter-spacing:3.5px}.hero h1{font-weight:950;letter-spacing:-3px}
.hero p{color:#9bbba7;line-height:1.85}
.hero .main-btn{min-width:220px;border-radius:16px;background:linear-gradient(135deg,#35d879,#11874a);box-shadow:0 12px 30px rgba(20,150,83,.23)}
.score-panel{background:linear-gradient(145deg,rgba(17,42,29,.94),rgba(9,27,18,.9));border:1px solid var(--line);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 20px 45px rgba(0,0,0,.3),0 0 40px rgba(53,216,121,.05)}
.hero .main-btn{box-shadow:0 12px 30px rgba(20,150,83,.23),0 0 24px rgba(53,216,121,.14)}
.record-badge{color:#7ff0a6}.chart-wrap{background:rgba(2,12,7,.48)}
.game{padding-top:10px}.game-top{max-width:900px;margin-bottom:10px}.game-title{font-size:20px}
.stat{background:rgba(15,45,29,.88);border:1px solid var(--line);border-radius:13px}.game-actions{gap:8px}
.exit-btn,.pause-btn{min-width:86px;padding:11px 14px;border-radius:13px;transition:transform .12s ease,filter .12s ease}
.exit-btn{background:rgba(73,32,30,.9);border-color:rgba(239,102,93,.35)}
.pause-btn{background:linear-gradient(135deg,#d49a34,#ad7210)}.pause-btn.resume{background:linear-gradient(135deg,#27c96d,#128a4a)}
#gameCanvas{border:1px solid rgba(106,221,139,.23);border-radius:24px;box-shadow:0 18px 55px rgba(0,0,0,.5),0 0 0 5px rgba(53,216,121,.025)}
.overlay{background:rgba(1,9,5,.78);backdrop-filter:blur(10px)}
.overlay-card{background:linear-gradient(145deg,#10291d,#0a1d14);border:1px solid rgba(112,222,145,.2);border-radius:26px;padding:28px 22px}
.overlay-icon{font-size:10px;letter-spacing:2.5px}.overlay h2{font-weight:900}.overlay .main-btn{border-radius:15px}
.settings .card{background:linear-gradient(145deg,rgba(16,40,28,.98),rgba(8,24,16,.98));border:1px solid var(--line);border-radius:26px}
.setting{background:rgba(255,255,255,.028);border-color:rgba(145,230,173,.09);border-radius:17px}
.setting select{appearance:none;background:#081b11;border-color:#28583d;border-radius:13px}
button{transition:transform .12s ease,filter .12s ease,background .2s ease}button:hover{filter:brightness(1.06)}
button:focus-visible{outline:2px solid #55e993;outline-offset:2px}
@media(max-width:760px){.home-shell{padding:14px 14px 10px}.home-main{grid-template-columns:1fr;gap:10px}.hero h1{font-size:56px}.hero p{font-size:13px}.score-panel{padding:15px;border-radius:22px}.chart-wrap{height:105px}.home-footer{display:none}.game-top{width:100%;padding:0 2px}.game-title{font-size:17px}.stat{padding:6px 8px;font-size:11px}.exit-btn,.pause-btn{min-width:76px;padding:9px 10px}#gameCanvas{border-radius:20px}}
@media(max-height:650px){.game-top{margin-bottom:6px}#gameCanvas{max-height:calc(100dvh - 82px)}}

</style></head>
<body>
<div class="app">

  <section id="homePage" class="page home active">
    <div class="home-shell">
      <header class="home-header">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#052011" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12c0-3 2-5 5-5s3 2 3 4-1 3-3 3-2-1-2-2 1-2 2-2"/>
              <circle cx="17" cy="7" r="1.4" fill="#052011" stroke="none"/>
              <path d="M13 15c1.5 2 3 3 5 3 2.5 0 4-2 4-4"/>
            </svg>
          </div>
          <div>
            <div class="brand-name">SNAKE</div>
            <div class="brand-sub">MODERN ARCADE</div></div></div>
        <button id="settingsBtn" class="icon-btn" aria-label="تنظیمات">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"/>
            <path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.9-1.3-2-3.4-2.2.7a7.7 7.7 0 0 0-2.6-1.5L14.1 2.5h-4l-.4 2.5a7.7 7.7 0 0 0-2.6 1.5l-2.2-.7-2 3.4L4.6 10.5a7.6 7.6 0 0 0 0 3l-1.9 1.3 2 3.4 2.2-.7a7.7 7.7 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 2.6-1.5l2.2.7 2-3.4-1.9-1.3Z"/>
          </svg>
        </button></header>

      <main class="home-main">
        <section class="hero">
          <div class="hero-kicker">SNAKE GAME</div>
          <h1>مار سبز</h1>
          <p>ساده شروع کن، بزرگ شو و رکورد خودت را بشکن.</p>
          <button id="enterGameBtn" class="main-btn">شروع بازی</button></section>

        <section class="score-panel">
          <div class="panel-head">
            <div>
              <span class="panel-label">رکورد شخصی</span>
              <strong id="homeHighScore">0</strong></div>
            <span class="record-badge">BEST</span></div>
          <div class="chart-wrap">
            <canvas id="scoreChart"></canvas></div>
          <div class="chart-foot">
            <span>امتیازهای اخیر</span>
            <span id="chartBestText">رکورد: ۰</span></div></section></main>

      <footer class="home-footer">
        <span>SWIPE TO MOVE</span>
        <span class="dot"></span>
        <span>SPACE / P برای توقف</span></footer></div></section>

  <section id="settingsPage" class="page settings">
    <div class="card">
      <div class="settings-title">
        <button id="settingsBackBtn" class="back-btn" aria-label="بازگشت">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        </button>
        <h2> تنظیمات بازی</h2></div>

      <div class="setting">
        <label for="difficulty">سطح سختی</label>
        <select id="difficulty">
          <option value="easy">آسان</option>
          <option value="normal">متوسط</option>
          <option value="hard">سخت</option></select></div>

      <div class="setting">
        <label for="speed">سرعت بازی</label>
        <select id="speed">
          <option value="slow">آرام</option>
          <option value="normal">معمولی</option>
          <option value="fast">سریع</option>
          <option value="turbo">خیلی سریع</option></select></div>

      <div class="setting">
        <label for="snakeSize">اندازه مار</label>
        <select id="snakeSize">
          <option value="small">کوچک</option>
          <option value="normal">معمولی</option>
          <option value="large">بزرگ</option></select></div>

      <div class="setting">
        <label for="wallMode">برخورد با دیوار</label>
        <select id="wallMode">
          <option value="dead">برخورد با دیوار = باخت</option>
          <option value="wrap">عبور از دیوار</option></select></div>

      <div class="setting">
        <label for="skin">پوسته / رنگ مار</label>
        <select id="skin">
          <option value="classic">کلاسیک (سبز)</option>
          <option value="neon">نئون آبی</option>
          <option value="gold">طلایی</option>
          <option value="ice">یخی</option>
          <option value="rainbow">رنگین‌کمان</option></select></div>

      <div class="setting">
        <label for="food">استیکر خوراکی</label>
        <select id="food">
          <option value="apple">🍎 سیب (مدرن)</option>
          <option value="strawberry">🍓 توت‌فرنگی</option>
          <option value="grape">🍇 انگور</option>
          <option value="star">⭐ ستاره</option></select></div>

      <div class="setting">
        <div class="switch-row">
          <label style="margin:0">نمایش خطوط جدول</label>
          <button id="gridSwitch" class="switch" aria-label="خطوط جدول"></button></div></div>

      <div class="setting">
        <div class="switch-row">
          <label style="margin:0">افزایش تدریجی سرعت با امتیاز</label>
          <button id="progressiveSwitch" class="switch" aria-label="افزایش تدریجی سرعت"></button></div></div>

      <div class="setting">
        <div class="switch-row">
          <label style="margin:0">صدا</label>
          <button id="soundSwitch" class="switch" aria-label="صدا"></button></div></div>

      <div class="setting">
        <div class="switch-row">
          <label style="margin:0">لرزش هنگام خوردن غذا</label>
          <button id="hapticSwitch" class="switch" aria-label="لرزش"></button></div></div>

      <button id="saveSettingsBtn" class="main-btn"> ذخیره تنظیمات</button></div></section>

  <section id="gamePage" class="page game">
    <div class="game-top">
      <div>
        <div class="game-title"> مار سبز</div>
        <div class="stats">
          <div class="stat">امتیاز: <b id="score">0</b></div>
          <div class="stat">رکورد: <b id="highScore">0</b></div></div></div>
      <div class="game-actions">
        <button id="exitGameBtn" class="exit-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          خروج</button>
        <button id="pauseBtn" class="pause-btn" disabled>
          <svg class="pauseIcon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <span id="pauseBtnText">توقف</span></button></div></div>

    <div class="board-wrap">
      <canvas id="gameCanvas" width="600" height="600"></canvas></div></section>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <div id="overlayIcon" class="overlay-icon">READY</div>
      <h2 id="overlayTitle">آماده‌ای؟</h2>
      <p id="overlayText">برای شروع بازی دکمه زیر را بزن.</p>
      <button id="overlayBtn" class="main-btn">شروع بازی</button>
      <div id="overlayExtraBtns" class="overlay-extra hidden">
        <button id="overlayHomeBtn" class="secondary-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-inline-end:5px"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4h4v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
          خانه</button>
        <button id="overlayExitBtn" class="secondary-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-inline-end:5px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          خروج از بازی</button>
      </div></div></div></div>

<script>
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const canvas = $("gameCanvas");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  if("imageSmoothingQuality" in ctx) ctx.imageSmoothingQuality = "high";

  const defaults = {
    difficulty: "normal",
    speed: "normal",
    snakeSize: "normal",
    wallMode: "dead",
    skin: "classic",
    food: "apple",
    grid: true,
    sound: true,
    haptic: true,
    progressiveSpeed: false
  };

  const skinColors = {
    classic: {head:"#8CFFB8", tail:"#149653", eye:"#052011", glow:"rgba(80,255,150,.55)"},
    neon:    {head:"#9dfcff", tail:"#0891b2", eye:"#01262b", glow:"rgba(90,230,255,.6)"},
    gold:    {head:"#ffe38a", tail:"#c9891a", eye:"#3a2603", glow:"rgba(255,205,90,.55)"},
    ice:     {head:"#d6ecff", tail:"#3b82c4", eye:"#0b2038", glow:"rgba(140,200,255,.55)"},
    rainbow: {head:"#ff9ad6", tail:"#7c5cff", eye:"#1a0630", glow:"rgba(200,150,255,.55)", rainbow:true}
  };


  let settings = loadSettings();
  let snake = [];
  let food = {x:0,y:0};
  let direction = {x:1,y:0};
  let nextDirection = {x:1,y:0};
  let score = 0;
  let highScore = Number(localStorage.getItem("snakeHighScore") || 0);
  let scoreHistory = loadScoreHistory();
  let timer = null;
  let running = false;
  let paused = false;
  let gameStarted = false;
  let gameOver = false;
  let audioCtx = null;

  const cells = 25;
  let grassPattern = null;
  let particles = [];
  let countdownValue = null;
  let hitFlashUntil = 0;
  let rafId = null;

  // ===== Snake glow cache =====
  // The snake's glow uses ctx.shadowBlur, which is one of the most
  // expensive canvas operations there is — measured every frame it
  // noticeably drags down low-end/webview devices. The snake's position
  // only actually changes on each game tick (a few times a second), not on
  // every animation frame, so we render the glowing snake once per tick
  // onto a small offscreen canvas and then just drawImage() it every
  // frame — visually identical, far cheaper.
  let snakeCanvas = null, snakeCtx = null;
  let snakeDirty = true;

  $("highScore").textContent = highScore;

  // ===== Canvas resolution fix: match the canvas's real on-screen pixel
  // size (with devicePixelRatio) instead of a fixed 600x600 internal
  // resolution, so the snake/board ratio stays crisp and correct on any
  // screen size instead of being stretched by CSS. =====
  function resizeCanvasToDisplaySize(){
    const rect = canvas.getBoundingClientRect();
    if(rect.width < 10) return; // canvas hidden (page not active yet)
    // Cap the device pixel ratio at 2: beyond that the extra sharpness is
    // imperceptible but the canvas' internal resolution (and therefore the
    // cost of every fill/gradient/blur drawn on it) keeps climbing, which
    // is what makes things crawl on 3x/4x-DPR phones inside webviews like
    // Eitaa's. Capping keeps the board just as crisp while cutting the
    // pixel count — and therefore the work per frame — substantially.
    const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    const pixelSize = Math.max(300, Math.round(rect.width * dpr));
    if(canvas.width !== pixelSize || canvas.height !== pixelSize){
      canvas.width = pixelSize;
      canvas.height = pixelSize;
      buildGrassPattern();
      snakeDirty = true;
      draw();
    }
  }

  function buildGrassPattern(){
    const s = canvas.width / cells;
    const tile = document.createElement("canvas");
    tile.width = s * 2;
    tile.height = s * 2;
    const tctx = tile.getContext("2d");
    tctx.fillStyle = "#123a24";
    tctx.fillRect(0, 0, s * 2, s * 2);
    tctx.fillStyle = "#15422a";
    tctx.fillRect(0, 0, s, s);
    tctx.fillRect(s, s, s, s);
    grassPattern = ctx.createPattern(tile, "repeat");
  }

  window.addEventListener("resize", resizeCanvasToDisplaySize);
  window.addEventListener("orientationchange", function(){
    setTimeout(resizeCanvasToDisplaySize, 250);
  });

  function loadSettings(){
    try{
      const saved = JSON.parse(localStorage.getItem("snakeSettings") || "{}");
      return Object.assign({}, defaults, saved);
    }catch(e){ return Object.assign({}, defaults); }
  }

  function loadScoreHistory(){
    try{
      const data=JSON.parse(localStorage.getItem("snakeScoreHistory")||"[]");
      return Array.isArray(data)?data.map(Number).filter(Number.isFinite).slice(-12):[];
    }catch(e){return [];}
  }

  function saveScoreHistory(value){
    if(value<=0)return;
    scoreHistory.push(value);
    scoreHistory=scoreHistory.slice(-12);
    localStorage.setItem("snakeScoreHistory",JSON.stringify(scoreHistory));
    drawScoreChart();
  }

  function drawScoreChart(){
    const c=$("scoreChart");
    if(!c)return;
    const r=c.getBoundingClientRect();
    const dpr=Math.min(2,Math.max(1,window.devicePixelRatio||1));
    const w=Math.max(300,Math.round(r.width*dpr));
    const h=Math.max(130,Math.round(r.height*dpr));
    c.width=w;c.height=h;
    const g=c.getContext("2d");
    g.clearRect(0,0,w,h);

    const vals=scoreHistory.length?scoreHistory:[0];
    const max=Math.max(5,...vals);
    const px=18*dpr,py=18*dpr,cw=w-px*2,ch=h-py*2;

    g.strokeStyle="rgba(108,191,133,.10)";
    g.lineWidth=dpr;
    for(let i=0;i<3;i++){
      const y=py+ch*i/2;
      g.beginPath();g.moveTo(px,y);g.lineTo(w-px,y);g.stroke();
    }

    const pts=vals.map((v,i)=>({
      x:vals.length===1?w/2:px+cw*i/(vals.length-1),
      y:py+ch*(1-v/max)
    }));

    if(pts.length>1){
      // Smooth curve through the points (quadratic mid-point technique)
      // instead of straight segments, for a more premium chart look.
      g.beginPath();
      g.moveTo(pts[0].x,pts[0].y);
      for(let i=0;i<pts.length-1;i++){
        const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
        g.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
      }
      g.quadraticCurveTo(pts[pts.length-2].x,pts[pts.length-2].y,pts[pts.length-1].x,pts[pts.length-1].y);

      g.save();
      g.shadowColor="rgba(70,230,140,.65)";
      g.shadowBlur=8*dpr;
      g.lineWidth=3*dpr;g.strokeStyle="#3bd676";g.lineJoin="round";g.lineCap="round";g.stroke();
      g.restore();

      g.lineTo(pts[pts.length-1].x,h-py);g.lineTo(pts[0].x,h-py);g.closePath();
      const gr=g.createLinearGradient(0,py,0,h);
      gr.addColorStop(0,"rgba(59,214,118,.22)");
      gr.addColorStop(1,"rgba(59,214,118,0)");
      g.fillStyle=gr;g.fill();

      pts.forEach(p=>{
        g.fillStyle="#071b12";g.beginPath();g.arc(p.x,p.y,5*dpr,0,Math.PI*2);g.fill();
        g.fillStyle="#5ce890";g.beginPath();g.arc(p.x,p.y,3*dpr,0,Math.PI*2);g.fill();
      });
    }

    $("homeHighScore").textContent=String(highScore);
    $("chartBestText").textContent="رکورد: "+String(highScore);
  }

  function saveSettings(){
    localStorage.setItem("snakeSettings", JSON.stringify(settings));
  }

  function fillSettings(){
    $("difficulty").value = settings.difficulty;
    $("speed").value = settings.speed;
    $("snakeSize").value = settings.snakeSize;
    $("wallMode").value = settings.wallMode;
    $("skin").value = settings.skin;
    $("food").value = settings.food;
    setSwitch($("gridSwitch"), settings.grid);
    setSwitch($("soundSwitch"), settings.sound);
    setSwitch($("hapticSwitch"), settings.haptic);
    setSwitch($("progressiveSwitch"), settings.progressiveSpeed);
    // Keep the custom dropdown labels in sync with the values set above.
    ["difficulty","speed","snakeSize","wallMode","skin","food"].forEach(function(id){
      $(id).dispatchEvent(new Event("change"));
    });
  }

  // ===== Custom dropdown menus for settings <select> elements =====
  // Each native <select> stays in the DOM (invisible, still holding the
  // real value) so all existing code that reads/sets `.value` keeps
  // working untouched; a themed button + expanding option list sits on
  // top of it and drives the same element.
  function buildCustomSelects(){
    document.querySelectorAll(".settings select").forEach(function(sel){
      if(sel.dataset.csBuilt) return;
      sel.dataset.csBuilt = "1";

      const wrap = document.createElement("div");
      wrap.className = "cs";
      sel.parentNode.insertBefore(wrap, sel);
      sel.classList.add("cs-native");
      wrap.appendChild(sel);

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "cs-trigger";
      trigger.setAttribute("aria-haspopup","listbox");
      trigger.innerHTML =
        '<span class="cs-value"></span>' +
        '<svg class="cs-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      wrap.appendChild(trigger);

      const menu = document.createElement("div");
      menu.className = "cs-menu";
      menu.setAttribute("role","listbox");
      wrap.appendChild(menu);

      function syncDisplay(){
        const opt = sel.options[sel.selectedIndex];
        trigger.querySelector(".cs-value").textContent = opt ? opt.textContent : "";
        menu.querySelectorAll(".cs-option").forEach(function(o){
          o.classList.toggle("active", o.dataset.value === sel.value);
        });
      }

      Array.prototype.forEach.call(sel.options, function(opt){
        const item = document.createElement("button");
        item.type = "button";
        item.className = "cs-option";
        item.textContent = opt.textContent;
        item.dataset.value = opt.value;
        item.setAttribute("role","option");
        item.onclick = function(){
          sel.value = opt.value;
          closeMenu();
          sel.dispatchEvent(new Event("change"));
        };
        menu.appendChild(item);
      });

      function openMenu(){
        document.querySelectorAll(".cs.open").forEach(function(o){
          if(o !== wrap) o.classList.remove("open");
        });
        wrap.classList.add("open");
      }
      function closeMenu(){ wrap.classList.remove("open"); }

      trigger.onclick = function(e){
        e.stopPropagation();
        wrap.classList.contains("open") ? closeMenu() : openMenu();
      };

      sel.addEventListener("change", syncDisplay);
      syncDisplay();
    });

    document.addEventListener("click", function(){
      document.querySelectorAll(".cs.open").forEach(function(o){ o.classList.remove("open"); });
    });
  }

  function setSwitch(el,on){
    el.classList.toggle("on", !!on);
  }

  function readSettings(){
    settings.difficulty = $("difficulty").value;
    settings.speed = $("speed").value;
    settings.snakeSize = $("snakeSize").value;
    settings.wallMode = $("wallMode").value;
    settings.skin = $("skin").value;
    settings.food = $("food").value;
    settings.grid = $("gridSwitch").classList.contains("on");
    settings.sound = $("soundSwitch").classList.contains("on");
    settings.haptic = $("hapticSwitch").classList.contains("on");
    settings.progressiveSpeed = $("progressiveSwitch").classList.contains("on");
    saveSettings();
    buildGrassPattern();
    snakeDirty = true;
  }

  function toggleSwitch(id){
    $(id).classList.toggle("on");
  }

  function showPage(id){
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    $(id).classList.add("active");
  }

  // extraMode: undefined/false = no extra buttons, "home" = show only the
  // home button (used on pause), "both" = show home + exit (game over).
  function showOverlay(icon,title,text,button,action,extraMode){
    $("overlayIcon").textContent = icon;
    $("overlayTitle").textContent = title;
    $("overlayText").textContent = text;
    $("overlayBtn").textContent = button;
    $("overlayBtn").onclick = action;
    $("overlayExtraBtns").classList.toggle("hidden", !extraMode);
    $("overlayHomeBtn").classList.toggle("hidden", extraMode!=="home" && extraMode!=="both");
    $("overlayExitBtn").classList.toggle("hidden", extraMode!=="both");
    $("overlay").classList.remove("hidden");
  }

  function hideOverlay(){
    $("overlay").classList.add("hidden");
  }

  function prepareGame(){
    stopTimer();
    running = false;
    paused = false;
    gameStarted = false;
    gameOver = false;
    countdownValue = null;
    particles = [];
    score = 0;
    $("score").textContent = "0";
    $("pauseBtn").disabled = true;
    $("pauseBtnText").textContent = "توقف";
    $("pauseBtn").classList.remove("resume");

    snake = [
      {x:12,y:12},
      {x:11,y:12},
      {x:10,y:12},
      {x:9,y:12}
    ];
    direction = {x:1,y:0};
    nextDirection = {x:1,y:0};
    snakeDirty = true;
    placeFood();
    resizeCanvasToDisplaySize();
    draw();
    startRenderLoop();

    showOverlay(
      "",
      "آماده‌ای؟",
      "بازی هنوز شروع نشده؛ هر وقت آماده بودی شروع کن.",
      "شروع بازی",
      startGame
    );
  }

  function startRenderLoop(){
    if(rafId) return;
    const loop = function(){
      draw();
      rafId = requestAnimationFrame(loop);
    };
    rafId = requestAnimationFrame(loop);
  }

  function stopRenderLoop(){
    if(rafId){
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  function startGame(){
    if(gameStarted && paused){
      resumeGame();
      return;
    }
    hideOverlay();
    if(gameOver || !gameStarted){
      prepareBoardOnly();
      runCountdown(beginRun);
    }else{
      beginRun();
    }
  }

  function runCountdown(cb){
    let n = 3;
    const step = function(){
      countdownValue = n;
      beep(n > 0 ? 440 : 640, 0.05);
      if(n <= 0){
        setTimeout(function(){ countdownValue = null; cb(); }, 380);
        return;
      }
      n--;
      setTimeout(step, 480);
    };
    step();
  }

  function beginRun(){
    gameStarted = true;
    gameOver = false;
    paused = false;
    running = true;
    $("pauseBtn").disabled = false;
    $("pauseBtnText").textContent = "توقف";
    $("pauseBtn").classList.remove("resume");
    startTimer();
  }

  function prepareBoardOnly(){
    stopTimer();
    score = 0;
    $("score").textContent = "0";
    snake = [
      {x:12,y:12},
      {x:11,y:12},
      {x:10,y:12},
      {x:9,y:12}
    ];
    direction = {x:1,y:0};
    nextDirection = {x:1,y:0};
    snakeDirty = true;
    placeFood();
    draw();
  }

  function getInterval(){
    // Slower baseline speeds than before (higher ms = slower snake).
    const diff = {easy:50,normal:0,hard:-40}[settings.difficulty] || 0;
    const speed = {slow:170,normal:130,fast:100,turbo:75}[settings.speed] || 130;
    let interval = speed + diff;
    if(settings.progressiveSpeed){
      interval -= Math.min(score * 1.5, 45);
    }
    return Math.max(45, interval);
  }

  function startTimer(){
    stopTimer();
    // Recursive setTimeout (not setInterval) so the tick rate can adapt
    // live when "progressive speed" ramps up with the score.
    const tick = function(){
      gameLoop();
      if(running && !paused) timer = setTimeout(tick, getInterval());
    };
    timer = setTimeout(tick, getInterval());
  }

  function stopTimer(){
    if(timer){
      clearTimeout(timer);
      timer = null;
    }
  }

  function togglePause(){
    if(!gameStarted || gameOver) return;

    if(paused) resumeGame();
    else pauseGame();
  }

  function pauseGame() {
  if (!running || gameOver) return;
  paused = true;
  running = false;
  stopTimer();
  $("pauseBtnText").textContent = "ادامه";
  $("pauseBtn").classList.add("resume");
  showOverlay("", "بازی متوقف شد", "بازی کاملاً متوقف شده است. برای ادامه، دکمه ادامه را بزنید.", "ادامه", resumeGame, "home");
}

function resumeGame() {
  if (!paused || gameOver) return;
  paused = false;
  running = true;
  $("pauseBtnText").textContent = "توقف";
  $("pauseBtn").classList.remove("resume");
  hideOverlay();
  startTimer();
}

  function endGame(){
    stopTimer();
    running = false;
    paused = false;
    gameOver = true;
    hitFlashUntil = performance.now() + 320;
    $("pauseBtn").disabled = true;
    $("pauseBtnText").textContent = "توقف";
    $("pauseBtn").classList.remove("resume");

    let isNewRecord = false;
    if(score > highScore){
      highScore = score;
      isNewRecord = score > 0;
      localStorage.setItem("snakeHighScore", String(highScore));
      $("highScore").textContent = highScore;
    }
    saveScoreHistory(score);
    drawScoreChart();

    beep(150,0.16);
    if(settings.haptic && navigator.vibrate) navigator.vibrate([40,30,40]);
    showOverlay(
      "",
      "بازی تمام شد!",
      (isNewRecord ? "🏆 رکورد جدید! " : "") + "امتیاز تو: " + score + " | رکورد: " + highScore,
      " بازی دوباره",
      startGame,
      "both"
    );
  }

  // Auto-pause when the tab/app goes to background — a common UX
  // improvement so the snake doesn't crash into a wall while you're away.
  document.addEventListener("visibilitychange", function(){
    if(document.hidden && running && !paused && gameStarted && !gameOver){
      pauseGame();
    }
  });

  function gameLoop(){
    if(!running || paused) return;

    direction = nextDirection;
    let head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    if(settings.wallMode === "wrap"){
      if(head.x < 0) head.x = cells - 1;
      if(head.x >= cells) head.x = 0;
      if(head.y < 0) head.y = cells - 1;
      if(head.y >= cells) head.y = 0;
    }else{
      if(head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells){
        endGame();
        return;
      }
    }

    const ate = head.x === food.x && head.y === food.y;

    const bodyToCheck = ate ? snake : snake.slice(0,-1);
    if(bodyToCheck.some(p => p.x === head.x && p.y === head.y)){
      endGame();
      return;
    }

    snake.unshift(head);
    snakeDirty = true;

    if(ate){
      const s = canvas.width / cells;
      spawnParticles(head.x*s+s/2, head.y*s+s/2);
      score++;
      const scoreEl = $("score");
      scoreEl.textContent = String(score);
      scoreEl.classList.remove("bump");
      void scoreEl.offsetWidth;
      scoreEl.classList.add("bump");
      if(score > highScore){
        highScore = score;
        $("highScore").textContent = String(highScore);
        localStorage.setItem("snakeHighScore", String(highScore));
      }
      placeFood();
      beep(700,0.055);
      if(settings.haptic && navigator.vibrate) navigator.vibrate(25);
    }else{
      snake.pop();
    }
    // Drawing itself now happens continuously via the requestAnimationFrame
    // render loop (startRenderLoop), so food-pulse/particle/countdown
    // animations stay smooth regardless of the snake's step speed.
  }

  function spawnParticles(x,y){
    const colors = ["#ffd76b","#ff9f5b","#ffe9a8"];
    for(let i=0;i<10;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 0.6 + Math.random()*1.6;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        born: performance.now(),
        life: 450 + Math.random()*250,
        color: colors[i % colors.length]
      });
    }
  }

  function updateAndDrawParticles(){
    if(!particles.length) return;
    const now = performance.now();
    particles = particles.filter(p => now - p.born < p.life);
    particles.forEach(p=>{
      const elapsed = now - p.born;
      const t = elapsed / p.life;
      const x = p.x + p.vx*elapsed*0.06;
      const y = p.y + p.vy*elapsed*0.06;
      ctx.globalAlpha = Math.max(0, 1-t);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x,y,Math.max(1,3*(1-t)+1),0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function placeFood(){
    let tries = 0;
    do{
      food = {
        x: Math.floor(Math.random()*cells),
        y: Math.floor(Math.random()*cells)
      };
      tries++;
    }while(snake.some(p => p.x === food.x && p.y === food.y) && tries < 1000);
  }

  function changeDirection(x,y){
    if(!gameStarted || gameOver) return;
    if(x === -direction.x && y === -direction.y) return;
    if(x === -nextDirection.x && y === -nextDirection.y) return;
    nextDirection = {x,y};
  }

  function draw(){
    if(!canvas.width) return;
    const s = canvas.width / cells;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // ===== Lawn / grass-yard background =====
    if(!grassPattern) buildGrassPattern();
    ctx.fillStyle = grassPattern || "#153a24";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(settings.grid){
      // One combined path + one stroke() call instead of 48 separate
      // beginPath/stroke pairs — same lines on screen, far fewer draw calls.
      ctx.strokeStyle = "rgba(102,190,128,.10)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(let i=1;i<cells;i++){
        const x = Math.round(i*s)+0.5, y = Math.round(i*s)+0.5;
        ctx.moveTo(x,0); ctx.lineTo(x,canvas.height);
        ctx.moveTo(0,y); ctx.lineTo(canvas.width,y);
      }
      ctx.stroke();
    }

    drawFood(s);
    drawSnakeCached(s);
    updateAndDrawParticles();

    // Hit flash on collision
    if(performance.now() < hitFlashUntil){
      const remain = (hitFlashUntil - performance.now()) / 320;
      ctx.fillStyle = "rgba(239,60,50," + (remain*0.35).toFixed(3) + ")";
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    // Countdown overlay (3, 2, 1, GO)
    if(countdownValue !== null && countdownValue !== undefined){
      ctx.fillStyle = "rgba(2,10,6,.4)";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = "#eafff2";
      ctx.font = "900 " + Math.round(canvas.width*0.2) + "px Tahoma,Arial,sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(countdownValue > 0 ? String(countdownValue) : "برو!", canvas.width/2, canvas.height/2);
    }
  }

  function drawFood(s){
    const fx = food.x*s + s/2;
    const fy = food.y*s + s/2;
    const pulse = 1 + Math.sin(performance.now()/220)*0.06;
    const r = s*.34*pulse;

    // Soft ambient glow behind the food — modern "inner glow" look,
    // and reads clearly on the grass background.
    const glowColors = {
      apple:"rgba(255,60,50,.35)",
      strawberry:"rgba(255,60,110,.35)",
      grape:"rgba(150,80,255,.35)",
      star:"rgba(255,205,60,.4)"
    };
    const glow = ctx.createRadialGradient(fx,fy,0,fx,fy,r*2.2);
    glow.addColorStop(0, glowColors[settings.food] || glowColors.apple);
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(fx,fy,r*2.2,0,Math.PI*2);
    ctx.fill();

    const drawers = { apple:drawApple, strawberry:drawStrawberry, grape:drawGrape, star:drawStar };
    (drawers[settings.food] || drawApple)(fx,fy,r);
  }

  // Every food type below is a hand-drawn vector shape (gradient fill +
  // glossy highlight), matching the apple's style — no reliance on the
  // device's built-in emoji font, which can look dated/inconsistent.

  // A modern vector apple: gradient body, glossy highlight, stem and leaf.
  function drawApple(cx,cy,r){
    const grad = ctx.createRadialGradient(cx-r*0.35,cy-r*0.35,r*0.1,cx,cy,r*1.05);
    grad.addColorStop(0,"#ff8a80");
    grad.addColorStop(0.55,"#ff3b30");
    grad.addColorStop(1,"#c81e13");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx,cy+r*0.05,r,r*1.02,0,0,Math.PI*2);
    ctx.fill();

    // top dimple
    ctx.fillStyle = "rgba(0,0,0,.12)";
    ctx.beginPath();
    ctx.ellipse(cx,cy-r*0.92,r*0.22,r*0.12,0,0,Math.PI*2);
    ctx.fill();

    // leaf
    ctx.fillStyle = "#3ecf5e";
    ctx.beginPath();
    ctx.ellipse(cx+r*0.4,cy-r*1.05,r*0.42,r*0.2,-0.6,0,Math.PI*2);
    ctx.fill();

    // stem
    ctx.strokeStyle = "#6b4226";
    ctx.lineWidth = Math.max(1.5,r*0.16);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx,cy-r*0.9);
    ctx.quadraticCurveTo(cx+r*0.12,cy-r*1.25,cx,cy-r*1.42);
    ctx.stroke();

    // glossy highlight
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath();
    ctx.ellipse(cx-r*0.35,cy-r*0.25,r*0.16,r*0.26,-0.5,0,Math.PI*2);
    ctx.fill();
  }

  // A modern vector strawberry: teardrop body, seed texture, leafy cap.
  function drawStrawberry(cx,cy,r){
    const grad = ctx.createRadialGradient(cx-r*0.3,cy-r*0.2,r*0.1,cx,cy+r*0.1,r*1.15);
    grad.addColorStop(0,"#ff8fa8");
    grad.addColorStop(0.5,"#ff3d68");
    grad.addColorStop(1,"#c40f3f");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx,cy+r*1.12);
    ctx.bezierCurveTo(cx-r*1.05,cy+r*0.7, cx-r*0.95,cy-r*0.55, cx,cy-r*0.62);
    ctx.bezierCurveTo(cx+r*0.95,cy-r*0.55, cx+r*1.05,cy+r*0.7, cx,cy+r*1.12);
    ctx.fill();

    // seeds
    ctx.fillStyle = "rgba(255,240,180,.9)";
    const seedPos = [[-.42,-.1],[.0,-.28],[.42,-.1],[-.28,.32],[.28,.32],[0,.62],[-.5,.2],[.5,.2]];
    seedPos.forEach(function(p){
      ctx.beginPath();
      ctx.ellipse(cx+p[0]*r, cy+p[1]*r, r*.06, r*.09, 0.3, 0, Math.PI*2);
      ctx.fill();
    });

    // leafy cap
    ctx.fillStyle = "#3ecf5e";
    for(let i=0;i<5;i++){
      const ang = -Math.PI/2 + (i-2)*0.5;
      ctx.beginPath();
      ctx.ellipse(cx+Math.cos(ang)*r*0.32, cy-r*0.62+Math.sin(ang)*r*0.22, r*0.24, r*0.11, ang, 0, Math.PI*2);
      ctx.fill();
    }

    // highlight
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath();
    ctx.ellipse(cx-r*0.32,cy-r*0.05,r*0.14,r*0.22,-0.4,0,Math.PI*2);
    ctx.fill();
  }

  // A modern vector grape cluster: layered glossy spheres + a small stem.
  function drawGrape(cx,cy,r){
    const berries = [
      [-0.42,-0.28],[0.42,-0.28],[0,-0.5],
      [-0.6,0.14],[0.6,0.14],[-0.22,0.14],[0.22,0.14],
      [-0.4,0.55],[0.4,0.55],[0,0.62]
    ];
    berries.forEach(function(p){
      const bx=cx+p[0]*r, by=cy+p[1]*r, br=r*0.42;
      const grad = ctx.createRadialGradient(bx-br*0.35,by-br*0.35,br*0.1,bx,by,br);
      grad.addColorStop(0,"#c9a6ff");
      grad.addColorStop(0.5,"#8b5cf6");
      grad.addColorStop(1,"#5b21b6");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(bx,by,br,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.4)";
      ctx.beginPath();
      ctx.arc(bx-br*0.32,by-br*0.32,br*0.22,0,Math.PI*2);
      ctx.fill();
    });

    // stem
    ctx.strokeStyle = "#6b4226";
    ctx.lineWidth = Math.max(1.4,r*0.14);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx,cy-r*0.7);
    ctx.quadraticCurveTo(cx+r*0.1,cy-r*1.05,cx-r*0.05,cy-r*1.3);
    ctx.stroke();
  }

  // A modern glowing star / power-up gem — golden gradient with a soft
  // outer glow, styled closer to a mobile-game "bonus" pickup.
  function drawStar(cx,cy,r){
    ctx.save();
    ctx.shadowColor = "rgba(255,205,60,.85)";
    ctx.shadowBlur = r*1.1;
    const grad = ctx.createRadialGradient(cx-r*0.25,cy-r*0.3,r*0.1,cx,cy,r*1.1);
    grad.addColorStop(0,"#fff3b0");
    grad.addColorStop(0.55,"#ffcc33");
    grad.addColorStop(1,"#e08a00");
    ctx.fillStyle = grad;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const outerAng = -Math.PI/2 + i*(Math.PI*2/5);
      const innerAng = outerAng + Math.PI/5;
      const ox = cx+Math.cos(outerAng)*r*1.08, oy = cy+Math.sin(outerAng)*r*1.08;
      const ix = cx+Math.cos(innerAng)*r*0.45, iy = cy+Math.sin(innerAng)*r*0.45;
      if(i===0) ctx.moveTo(ox,oy); else ctx.lineTo(ox,oy);
      ctx.lineTo(ix,iy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.beginPath();
    ctx.ellipse(cx-r*0.18,cy-r*0.22,r*0.16,r*0.1,-0.5,0,Math.PI*2);
    ctx.fill();
  }

  // A single continuous, rounded snake body (no separated blocks) using a
  // round-joined stroked path, plus a distinct rounded head with eyes.
  // Renders the snake onto the given context (defaults to the main
  // on-screen ctx). Used both directly and to build the cached offscreen
  // glow sprite in drawSnakeCached().
  function drawSnake(s, targetCtx){
    const c = targetCtx || ctx;
    const sizeMap = {small:.6,normal:.72,large:.86};
    const factor = sizeMap[settings.snakeSize] || .72;
    const w = s*factor;
    const skin = skinColors[settings.skin] || skinColors.classic;

    c.lineCap = "round";
    c.lineJoin = "round";

    if(snake.length > 1){
      c.beginPath();
      for(let i=snake.length-1;i>=0;i--){
        const p = snake[i];
        const cx = p.x*s+s/2, cy = p.y*s+s/2;
        if(i === snake.length-1) c.moveTo(cx,cy); else c.lineTo(cx,cy);
      }
      if(skin.rainbow){
        const grad = c.createLinearGradient(
          snake[snake.length-1].x*s, snake[snake.length-1].y*s,
          snake[0].x*s, snake[0].y*s
        );
        grad.addColorStop(0,"#7c5cff");
        grad.addColorStop(0.33,"#5cc8ff");
        grad.addColorStop(0.66,"#5cffb0");
        grad.addColorStop(1,"#ff9ad6");
        c.strokeStyle = grad;
      }else{
        const grad = c.createLinearGradient(
          snake[snake.length-1].x*s, snake[snake.length-1].y*s,
          snake[0].x*s, snake[0].y*s
        );
        grad.addColorStop(0, skin.tail);
        grad.addColorStop(1, skin.head);
        c.strokeStyle = grad;
      }
      c.lineWidth = w;
      // Soft neon glow along the body — a subtle 2026-style "inner glow"
      // that keeps the snake readable and modern-looking on the lawn.
      c.save();
      c.shadowColor = skin.glow;
      c.shadowBlur = w*0.6;
      c.stroke();
      c.restore();
    }

    // Head — drawn as a crisp circle on top so it always reads clearly.
    const head = snake[0];
    const hx = head.x*s+s/2, hy = head.y*s+s/2;
    c.save();
    c.shadowColor = skin.glow;
    c.shadowBlur = w*0.7;
    c.fillStyle = skin.rainbow ? "#ff9ad6" : skin.head;
    c.beginPath();
    c.arc(hx,hy,w/2,0,Math.PI*2);
    c.fill();
    c.restore();

    // Eyes, oriented toward the direction of travel.
    c.fillStyle = skin.eye;
    let ex1=hx-w*.18, ex2=hx+w*.18, ey=hy-w*.20;
    if(direction.x === 1){ ex1=hx+w*.18; ex2=hx+w*.18; ey=hy-w*.20; }
    if(direction.x === -1){ ex1=hx-w*.18; ex2=hx-w*.18; ey=hy-w*.20; }
    if(direction.y === 1){ ex1=hx-w*.18; ex2=hx+w*.18; ey=hy+w*.18; }
    if(direction.y === -1){ ex1=hx-w*.18; ex2=hx+w*.18; ey=hy-w*.18; }
    c.beginPath();c.arc(ex1,ey,s*.055,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(ex2,ey,s*.055,0,Math.PI*2);c.fill();
  }

  // Draws the snake via the cached offscreen sprite, only re-rendering
  // that sprite (the expensive shadowBlur pass) when the snake has
  // actually moved/changed since the last render, instead of every frame.
  function drawSnakeCached(s){
    if(!snake.length) return;
    if(!snakeCanvas){
      snakeCanvas = document.createElement("canvas");
      snakeCtx = snakeCanvas.getContext("2d");
    }
    if(snakeCanvas.width !== canvas.width || snakeCanvas.height !== canvas.height){
      snakeCanvas.width = canvas.width;
      snakeCanvas.height = canvas.height;
      snakeDirty = true;
    }
    if(snakeDirty){
      snakeCtx.clearRect(0,0,snakeCanvas.width,snakeCanvas.height);
      drawSnake(s, snakeCtx);
      snakeDirty = false;
    }
    ctx.drawImage(snakeCanvas,0,0);
  }

  function beep(freq,duration){
    if(!settings.sound) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(.045,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start();osc.stop(audioCtx.currentTime+duration);
    }catch(e){}
  }

  // ===== Touch swipe control — works across the ENTIRE screen while the
  // game page is open, not just over the board, so a swipe that starts
  // anywhere (header, margins, empty space) still steers the snake.
  // Buttons/selects are excluded so they stay tappable normally. =====
  let touchStartX=0, touchStartY=0, touchActive=false;

  function isGamePageActive(){
    return $("gamePage").classList.contains("active");
  }

  document.addEventListener("touchstart",function(e){
    if(!isGamePageActive()) return;
    if(e.target.closest("button,select,.overlay-card")) return;
    if(!e.touches[0]) return;
    touchActive = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  },{passive:true});

  document.addEventListener("touchmove",function(e){
    if(isGamePageActive() && touchActive) e.preventDefault();
  },{passive:false});

  document.addEventListener("touchend",function(e){
    if(!touchActive) return;
    touchActive = false;
    if(!isGamePageActive()) return;
    const t = e.changedTouches[0];
    if(!t) return;
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
    if(Math.abs(dx) > Math.abs(dy)){
      changeDirection(dx>0?1:-1,0);
    }else{
      changeDirection(0,dy>0?1:-1);
    }
  },{passive:true});

  document.addEventListener("keydown",function(e){
    const k=e.key.toLowerCase();
    const gameKey=["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"," ","p","escape"].includes(k);
    if(gameKey && isGamePageActive()) e.preventDefault();
    if(k==="arrowup" || k==="w") changeDirection(0,-1);
    else if(k==="arrowdown" || k==="s") changeDirection(0,1);
    else if(k==="arrowleft" || k==="a") changeDirection(-1,0);
    else if(k==="arrowright" || k==="d") changeDirection(1,0);
    else if(k===" " || k==="p") togglePause();
    else if(k==="escape" && isGamePageActive()) $("exitGameBtn").click();
  });

  $("enterGameBtn").onclick = function(){
    showPage("gamePage");
    resizeCanvasToDisplaySize();
    prepareGame();
  };

  $("settingsBtn").onclick = function(){
    fillSettings();
    showPage("settingsPage");
  };

  // Shared "leave the running game and go back to the home screen" logic,
  // used by both the in-game top-bar exit button and the game-over
  // overlay's home button.
  function goHome(){
    stopTimer();
    stopRenderLoop();
    running = false;
    paused = false;
    gameStarted = false;
    gameOver = false;
    countdownValue = null;
    direction = {x:1,y:0};
    nextDirection = {x:1,y:0};
    snakeDirty = true;
    $("pauseBtn").disabled = true;
    $("pauseBtnText").textContent = "توقف";
    $("pauseBtn").classList.remove("resume");
    hideOverlay();
    showPage("homePage");
    drawScoreChart();
  }

  // "Exit" button on the game-over screen — actually closes the game.
  function attemptExitApp(){
    try{ window.close(); }catch(e){}
    setTimeout(function(){
      if(!document.hidden){
        $("overlayText").textContent = "برای خروج کامل، این صفحه یا تب را ببندید.";
      }
    },350);
  }

  $("exitGameBtn").onclick = goHome;
  $("overlayHomeBtn").onclick = goHome;
  $("overlayExitBtn").onclick = attemptExitApp;

  $("settingsBackBtn").onclick = function(){
    showPage("homePage");
  };

  $("saveSettingsBtn").onclick = function(){
    readSettings();
    showPage("homePage");
  };

  $("gridSwitch").onclick = ()=>toggleSwitch("gridSwitch");
  $("soundSwitch").onclick = ()=>toggleSwitch("soundSwitch");
  $("hapticSwitch").onclick = ()=>toggleSwitch("hapticSwitch");
  $("progressiveSwitch").onclick = ()=>toggleSwitch("progressiveSwitch");

  $("pauseBtn").onclick = togglePause;

  // Back behavior for Android/Eitaa-like webviews.
  window.addEventListener("popstate",function(){
    stopTimer();
    stopRenderLoop();
    showPage("homePage");
  });

  // Initial render
  buildCustomSelects();
  fillSettings();
  snake = [
    {x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12}
  ];
  placeFood();
  drawScoreChart();
  window.addEventListener("resize", drawScoreChart);
})();
</script></body></html>
