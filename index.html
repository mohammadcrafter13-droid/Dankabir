<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <!-- Eitaa WebApp SDK
         باید مستقیماً از سرور رسمی ایتا و قبل از سایر اسکریپت‌ها لود شود -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">

    <title>Snake - Eitaa Mini App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="app">

        <header class="top-bar">

            <div>
                <h1>🐍 مار بازی</h1>
                <p id="welcome">آماده‌ای؟</p>
            </div>

            <button
                id="backButton"
                class="icon-button"
                type="button"
                aria-label="بازگشت"
            >
                ←
            </button>

        </header>


        <section class="score-panel">

            <div class="score-box">
                <span>امتیاز</span>
                <strong id="score">0</strong>
            </div>

            <div class="score-box">
                <span>رکورد</span>
                <strong id="highScore">0</strong>
            </div>

        </section>


        <section class="game-wrapper">

            <canvas id="gameCanvas"></canvas>

            <div
                id="gameOverlay"
                class="game-overlay"
            >

                <div class="overlay-card">

                    <div
                        id="overlayEmoji"
                        class="overlay-emoji"
                    >
                        🐍
                    </div>

                    <h2 id="overlayTitle">
                        مار بازی
                    </h2>

                    <p id="overlayMessage">
                        برای شروع بازی روی دکمه زیر بزن
                    </p>

                    <button
                        id="startButton"
                        class="primary-button"
                        type="button"
                    >
                        شروع بازی
                    </button>

                </div>

            </div>

        </section>


        <section class="controls">

            <button
                class="control up"
                data-direction="up"
                type="button"
            >
                ▲
            </button>

            <div class="middle-controls">

                <button
                    class="control"
                    data-direction="right"
                    type="button"
                >
                    ◀
                </button>

                <button
                    class="control"
                    data-direction="down"
                    type="button"
                >
                    ▼
                </button>

                <button
                    class="control"
                    data-direction="left"
                    type="button"
                >
                    ▶
                </button>

            </div>

        </section>


        <footer>

            <span id="status">
                آماده
            </span>

            <span>
                🍎 غذا بخور، بزرگ‌تر شو!
            </span>

        </footer>

    </main>


    <script src="game.js"></script>

</body>

</html>
