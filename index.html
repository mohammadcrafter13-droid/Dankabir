<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>برنامک ایتا</title>

  <!-- باید همیشه اول از همه، قبل از هر اسکریپت دیگری لود بشه -->
  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--tg-theme-bg-color, #f4f5f7);
      color: var(--tg-theme-text-color, #1a1a1a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: var(--tg-theme-text-color, #1a1a1a);
    }

    p {
      color: var(--tg-theme-hint-color, #6b7280);
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .info-box {
      background: rgba(0,0,0,0.03);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: right;
      font-size: 0.9rem;
    }

    .info-box div {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .info-box div:last-child {
      border-bottom: none;
    }

    .info-box span:first-child {
      color: var(--tg-theme-hint-color, #6b7280);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    button:active {
      opacity: 0.8;
    }

    .status {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--tg-theme-hint-color, #6b7280);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>👋 خوش اومدی</h1>
    <p>این یک برنامک نمونه است که به کیت توسعه‌ی ایتا (Eitaa Web App SDK) متصل شده.</p>

    <div class="info-box" id="userInfo">
      <div><span>نام:</span><span id="userName">در حال بارگذاری...</span></div>
      <div><span>شناسه کاربری:</span><span id="userId">-</span></div>
      <div><span>پلتفرم:</span><span id="platform">-</span></div>
      <div><span>نسخه SDK:</span><span id="sdkVersion">-</span></div>
    </div>

    <button id="mainActionBtn">ارسال داده به بات</button>
    <button id="closeBtn" style="background: #ef4444;">بستن برنامک</button>

    <div class="status" id="status">در حال اتصال به ایتا...</div>
  </div>

<script>
  // منتظر می‌مانیم تا مطمئن شویم اسکریپت SDK لود شده است
  window.addEventListener('DOMContentLoaded', () => {
    const statusEl = document.getElementById('status');

    if (typeof Eitaa === 'undefined' || !Eitaa.WebApp) {
      statusEl.textContent = '⚠️ SDK ایتا لود نشد. این صفحه باید داخل اپ ایتا باز شود.';
      statusEl.style.color = '#ef4444';
      return;
    }

    const tg = Eitaa.WebApp;

    // اعلام آماده بودن برنامک به اپلیکیشن ایتا
    tg.ready();

    // تمام صفحه کردن برنامک (در صورت پشتیبانی)
    if (tg.expand) tg.expand();

    // نمایش اطلاعات کاربر در صورت وجود
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    document.getElementById('userName').textContent = user
      ? `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'ناشناس'
      : 'در دسترس نیست';
    document.getElementById('userId').textContent = user ? user.id : '-';
    document.getElementById('platform').textContent = tg.platform || '-';
    document.getElementById('sdkVersion').textContent = tg.version || '-';

    statusEl.textContent = '✅ اتصال به ایتا برقرار شد';
    statusEl.style.color = '#22c55e';

    // نمایش دکمه اصلی ایتا (در پایین صفحه اپ) - اختیاری
    if (tg.MainButton) {
      tg.MainButton.setText('تایید و ادامه');
      tg.MainButton.show();
      tg.MainButton.onClick(() => {
        tg.HapticFeedback && tg.HapticFeedback.impactOccurred('medium');
        alert('دکمه اصلی ایتا کلیک شد');
      });
    }

    // دکمه‌ی ارسال داده به بات
    document.getElementById('mainActionBtn').addEventListener('click', () => {
      const payload = JSON.stringify({ action: 'sample_action', value: Date.now() });
      if (tg.sendData) {
        tg.sendData(payload);
      } else {
        alert('این متد در نسخه فعلی SDK در دسترس نیست.');
      }
    });

    // دکمه‌ی بستن برنامک
    document.getElementById('closeBtn').addEventListener('click', () => {
      if (tg.close) {
        tg.close();
      } else {
        alert('این متد در نسخه فعلی SDK در دسترس نیست.');
      }
    });
  });
</script>

</body>
</html>
