<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بازی مار</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- صفحه اصلی -->
    <section id="homeScreen" class="screen home-screen active">
      <header class="home-title">
        <h1>بازی مار</h1>
        <div class="snake-logo" aria-hidden="true">
          <span class="logo-body b1"></span><span class="logo-body b2"></span>
          <span class="logo-body b3"></span><span class="logo-head">◉ ◉</span>
        </div>
      </header>

      <div class="home-board">
        <div class="mini-grid"></div>
        <div class="mini-snake">
          <span></span><span></span><span></span><span></span><span></span><i>◉◉</i>
        </div>
        <div class="apple">🍎</div>

        <button id="startBtn" class="primary-btn">
          <span class="play-icon">▶</span>
          ورود به بازی
        </button>

        <button id="settingsBtn" class="secondary-btn">
          <span>⚙</span> تنظیمات
        </button>
      </div>
    </section>

    <!-- تنظیمات -->
    <section id="settingsScreen" class="screen settings-screen">
      <div class="settings-panel">
        <button id="closeSettings" class="close-btn" aria-label="بستن">×</button>
        <h2>⚙️ &nbsp; تنظیمات</h2>

        <div class="setting-card">
          <h3>سطح بازی 🎮</h3>
          <div class="segmented">
            <button data-level="easy">آسان</button>
            <button data-level="medium" class="selected">متوسط</button>
            <button data-level="hard">سخت</button>
          </div>
        </div>

        <div class="setting-card">
          <h3>سرعت مار</h3>
          <div class="range-row">
            <span>کم</span>
            <input id="speedRange" type="range" min="1" max="10" value="5">
            <span>زیاد</span>
          </div>
        </div>

        <div class="setting-card">
          <h3>صدا 🔊</h3>
          <div class="range-row">
            <label class="switch"><input id="soundToggle" type="checkbox" checked><span></span></label>
            <input id="soundRange" type="range" min="0" max="100" value="80">
          </div>
        </div>

        <div class="setting-card">
          <h3>موسیقی 🎵</h3>
          <div class="range-row">
            <label class="switch"><input id="musicToggle" type="checkbox" checked><span></span></label>
            <input id="musicRange" type="range" min="0" max="100" value="55">
          </div>
        </div>

        <div class="setting-card theme-card">
          <h3>تم بازی</h3>
          <div class="themes">
            <button class="theme selected" data-theme="green">🌿</button>
            <button class="theme" data-theme="night">🌙</button>
            <button class="theme" data-theme="sunset">🌅</button>
            <button class="theme" data-theme="desert">🌵</button>
          </div>
        </div>

        <button id="resetSettings" class="reset-btn">↻ &nbsp; بازنشانی تنظیمات</button>
      </div>
    </section>

    <!-- صفحه بازی -->
    <section id="gameScreen" class="screen game-screen">
      <header class="game-header">
        <button id="gameSettingsBtn" class="header-btn">⚙ <span>تنظیمات</span></button>
        <h1>بازی مار</h1>
        <div class="score-top">🏆 امتیاز: <b id="score">۰</b></div>
      </header>

      <div class="game-layout">
        <div class="game-board-wrap">
          <canvas id="gameCanvas" width="900" height="650"></canvas>
        </div>

        <aside class="game-sidebar">
          <div class="stat-box">
            <span>امتیاز</span>
            <strong id="sideScore">۰</strong>
          </div>
          <div class="stat-box">
            <span>بالاترین امتیاز</span>
            <strong id="highScore">۰</strong>
          </div>
          <button id="pauseBtn" class="pause-btn">Ⅱ &nbsp; توقف بازی</button>
          <div class="dpad">
            <button data-dir="up">⌃</button>
            <div>
              <button data-dir="left">‹</button>
              <button data-dir="down">⌄</button>
              <button data-dir="right">›</button>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <!-- پایان بازی -->
    <div id="gameOver" class="modal hidden">
      <div class="modal-box">
        <div class="modal-emoji">🐍</div>
        <h2>بازی تمام شد!</h2>
        <p>امتیاز شما: <b id="finalScore">۰</b></p>
        <button id="restartBtn" class="primary-btn">دوباره بازی کن</button>
        <button id="homeBtn" class="secondary-btn">بازگشت به صفحه اصلی</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
