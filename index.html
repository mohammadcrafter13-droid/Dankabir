<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <!-- Eitaa WebApp SDK -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

    <title>بازی مار</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            min-height: 100vh;

            background: var(--tg-theme-bg-color, #111);
            color: var(--tg-theme-text-color, #fff);

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 500px;

            padding: 15px;

            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        #game {
            width: 100%;
            max-width: 450px;

            aspect-ratio: 1 / 1;

            background: var(
                --tg-theme-secondary-bg-color,
                #222
            );

            border-radius: 15px;

            display: block;

            margin: auto;
        }

        .controls {
            margin: 20px auto 0;

            display: grid;

            grid-template-columns: 70px 70px 70px;

            grid-template-rows: 70px 70px;

            gap: 8px;

            justify-content: center;

            direction: ltr;
        }

        .control {
            border: none;

            border-radius: 15px;

            background: var(
                --tg-theme-button-color,
                #2481cc
            );

            color: var(
                --tg-theme-button-text-color,
                #fff
            );

            font-size: 25px;

            cursor: pointer;

            touch-action: manipulation;
        }

        .control:active {
            transform: scale(0.92);
        }

        .up {
            grid-column: 2;
            grid-row: 1;
        }

        .left {
            grid-column: 1;
            grid-row: 2;
        }

        .down {
            grid-column: 2;
            grid-row: 2;
        }

        .right {
            grid-column: 3;
            grid-row: 2;
        }

    </style>

</head>


<body>

    <div class="game-container">

        <h1>🐍 بازی مار</h1>

        <canvas id="game"></canvas>


        <div class="controls">

            <button class="control up">
                ▲
            </button>

            <button class="control left">
                ◀
            </button>

            <button class="control down">
                ▼
            </button>

            <button class="control right">
                ▶
            </button>

        </div>

    </div>


    <script>

        // ==========================
        // اتصال به ایتا
        // ==========================

        const WebApp = Eitaa.WebApp;

        WebApp.ready();

        if (typeof WebApp.expand === "function") {
            WebApp.expand();
        }


        // ==========================
        // Canvas
        // ==========================

        const canvas =
            document.getElementById("game");

        const ctx =
            canvas.getContext("2d");


        // اندازه زمین بازی
        const gridSize = 20;


        // ==========================
        // تنظیم اندازه Canvas
        // ==========================

        function resizeCanvas() {

            const size =
                Math.min(
                    window.innerWidth - 30,
                    450
                );

            canvas.width = size;
            canvas.height = size;
        }


        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        // ==========================
        // مار
        // ==========================

        const snake = [

            {
                x: 10,
                y: 10
            },

            {
                x: 9,
                y: 10
            },

            {
                x: 8,
                y: 10
            }

        ];


        // ==========================
        // نمایش مار
        // ==========================

        function draw() {

            const cellSize =
                canvas.width / gridSize;


            // پاک کردن صفحه
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // رسم مار
            snake.forEach(
                (part, index) => {

                    const padding = 2;

                    const x =
                        part.x * cellSize
                        + padding;

                    const y =
                        part.y * cellSize
                        + padding;

                    const size =
                        cellSize
                        - padding * 2;


                    if (index === 0) {

                        ctx.fillStyle = "#2ed573";

                    } else {

                        ctx.fillStyle = "#7bed9f";

                    }


                    ctx.beginPath();

                    ctx.roundRect(
                        x,
                        y,
                        size,
                        size,
                        5
                    );

                    ctx.fill();

                }
            );

        }


        // ==========================
        // کنترل‌ها
        // ==========================

        document
            .querySelector(".up")
            .addEventListener(
                "click",
                () => {

                    console.log("UP");

                }
            );


        document
            .querySelector(".down")
            .addEventListener(
                "click",
                () => {

                    console.log("DOWN");

                }
            );


        document
            .querySelector(".left")
            .addEventListener(
                "click",
                () => {

                    console.log("LEFT");

                }
            );


        document
            .querySelector(".right")
            .addEventListener(
                "click",
                () => {

                    console.log("RIGHT");

                }
            );


        // ==========================
        // شروع
        // ==========================

        draw();

    </script>

</body>

</html>
